set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

set -sg escape-time 10
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g status-left-length 30

# set-hook -g session-closed 'run-shell 
# ""'code --remove . &&
bind-key X confirm-before -p "Kill #S (y/n)?" "run-shell  'tmux switch-client -n && tmux kill-session -t \"#S\"'"


bind r source-file ~/.tmux.conf

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Escape send-keys -X cancel

# open new panes in same directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# search for new window folder
bind-key -r f new-window "$SHELL -c 'cd $(fd . ~/Local_Projects --type d | fzf) && exec $SHELL -l'"
bind-key -r F new-window "$SHELL -c 'source $HOME/.scripts/tmux_create_session.sh && exec $SHELL -l'"

# select ssh host to connect to; C-m is equalivant of pressing enter
bind-key -r C-s send-keys "source $HOME/.scripts/ssh_select.sh" C-m 
bind-key -r s send-keys "source $HOME/.scripts/tmux_select_session.sh" C-m

#change color
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g window-status-current-format '#[bg=red fg=white] #I:#W #[default]'

#border
# set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=green,bold
set -g pane-border-status top
set -g pane-border-format " [ ###P #{pane_current_command} ] "


# name windows current path instead of process
# set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b;s/jracaniell/~/:pane_current_path}'
