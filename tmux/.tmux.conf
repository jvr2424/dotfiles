set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

set -sg escape-time 10
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g status-left-length 30

# use Ctrl+a as the prefix on the Ubuntu servers, default Ctrl+b on Mac
if-shell "uname | grep -q Linux" \
    "set -g prefix C-a; unbind C-b; bind C-a send-prefix"

# sync .env vars (PROJECTS_DIR, OBSIDIAN_DIR) into tmux's own environment so
# bind-key commands below pick up .env changes on reload (prefix + r), not
# just when the tmux server first starts
run-shell "$HOME/.scripts/tmux_sync_env.sh"

# set-hook -g session-closed 'run-shell 
# ""'code --remove . &&
bind-key X confirm-before -p "Kill #S (y/n)?" "run-shell  'tmux switch-client -n && tmux kill-session -t \"#S\"'"


bind r source-file ~/.tmux.conf

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Escape send-keys -X cancel

# open new panes in same directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# search for new window folder
bind-key -r f new-window "$SHELL -c 'cd $(fd . \"\$PROJECTS_DIR\" --type d | fzf) && exec $SHELL -l'"
bind-key -r F new-window "$SHELL -c 'source $HOME/.scripts/tmux_create_session.sh'"

# select ssh host to connect to
bind-key -r C-s new-window "$SHELL -c 'source $HOME/.scripts/ssh_select.sh'"
bind-key -r s new-window "$SHELL -c 'source $HOME/.scripts/tmux_select_session.sh'"

#change color
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g window-status-current-format '#[bg=red fg=white] #I:#W #[default]'

#border
# set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=green,bold
set -g pane-border-status top
set -g pane-border-format " [ ###P #{pane_current_command} ] "


# Default: name windows by process (standard tmux behavior)
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{pane_current_command}'

# Toggle window name: process <-> basepath + process
bind-key -r W if-shell "[ '#{@window_name_mode}' = 'path' ]" \
    "set-option -u @window_name_mode; set-option automatic-rename-format '#{pane_current_command}'; display-message 'Window name: process only'" \
    "set-option @window_name_mode 'path'; set-option automatic-rename-format '#{b:pane_current_path}>#{pane_current_command}'; display-message 'Window name: path + process'"

set -g status-right "#H | #{pane_current_path}"

