---
ansible_connection: local

dotfiles_dir: "{{ lookup('env', 'HOME') }}/.dotfiles"

# Stow packages applied on every machine (Mac + Ubuntu).
stow_packages:
  - bash
  - zsh
  - tmux
  - nvim
  - scripts
  - ruff
  - local

# Global default `uv` Python version, plus any extra unpinned versions to
# install alongside it. Overridden per-host in host_vars/ for the one Mac
# that still needs 3.12 as its default (and 3.9 available, unpinned).
python_default_version: "3.14"
python_extra_versions: []
