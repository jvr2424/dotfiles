---
# Straightforward apt-installable equivalents of the Brewfile's CLI tools.
# Not covered here (handled by dedicated tasks in packages_ubuntu.yml):
#   - fd        -> apt package is `fd-find`, binary is `fdfind`, symlinked to `fd`
#   - gh        -> not in default repos, added via its own apt repo
#   - neovim    -> too stale in apt for this lazy.nvim config; installed via bob-nvim instead
#   - duckdb    -> no apt package; installed from the official GitHub release tarball
#   - ruff      -> installed via `uv tool install ruff` instead of apt
#   - pkl       -> intentionally not installed on Ubuntu (not needed there)
apt_packages:
  - bash
  - bash-completion
  - build-essential
  - cmake
  - curl
  - fzf
  - git
  - ripgrep
  - stow
  - tmux
  - unzip

duckdb_version: "1.1.3"
duckdb_url: "https://github.com/duckdb/duckdb/releases/download/v{{ duckdb_version }}/duckdb_cli-linux-amd64.zip"
